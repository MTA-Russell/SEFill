<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14181c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Service Order">

<title>MagTec Service Order</title>
<style>
  :root{
    --bg:#14181c;
    --panel:#1c2127;
    --panel-line:#2b323b;
    --text:#eef1f4;
    --sub:#8d98a3;
    --amber:#f5a623;
    --amber-dim:#3a2f14;
    --danger:#e5533d;
    --ok:#3ba776;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:20px;
  }
  .card{
    width:100%;
    max-width:520px;
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:10px;
    overflow:hidden;
  }
  .head{
    padding:18px 22px 14px;
    border-bottom:1px solid var(--panel-line);
  }
  .head .tag{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--amber);
    font-weight:700;
  }
  .head h1{
    margin:4px 0 0;
    font-size:19px;
    font-weight:600;
  }
  .progress-track{
    height:4px;
    background:var(--panel-line);
    width:100%;
  }
  .progress-fill{
    height:100%;
    background:var(--amber);
    width:0%;
    transition:width .25s ease;
  }
  .step-count{
    padding:10px 22px 0;
    font-size:12px;
    color:var(--sub);
    font-variant-numeric:tabular-nums;
  }
  .body{
    padding:22px;
    min-height:220px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .q-label{
    font-size:16px;
    font-weight:600;
    margin-bottom:4px;
    line-height:1.35;
  }
  .q-help{
    font-size:13px;
    color:var(--sub);
    margin-bottom:16px;
    line-height:1.4;
  }
  input[type=text], input[type=number], input[type=date], textarea{
    width:100%;
    background:var(--bg);
    border:1px solid var(--panel-line);
    color:var(--text);
    font-size:16px;
    padding:13px 14px;
    border-radius:7px;
    font-family:inherit;
    outline:none;
  }
  input:focus, textarea:focus{
    border-color:var(--amber);
  }
  textarea{
    min-height:100px;
    resize:vertical;
  }
  .yn-row{
    display:flex;
    gap:12px;
  }
  .yn-btn{
    flex:1;
    padding:15px;
    border-radius:7px;
    border:1px solid var(--panel-line);
    background:var(--bg);
    color:var(--text);
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .yn-btn.selected-yes{
    border-color:var(--ok);
    background:rgba(59,167,118,.14);
    color:var(--ok);
  }
  .yn-btn.selected-no{
    border-color:var(--danger);
    background:rgba(229,83,61,.14);
    color:var(--danger);
  }
  .foot{
    display:flex;
    gap:10px;
    padding:16px 22px 22px;
    border-top:1px solid var(--panel-line);
  }
  button.nav{
    border:none;
    border-radius:7px;
    padding:14px 18px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-back{
    background:transparent;
    color:var(--sub);
    border:1px solid var(--panel-line);
  }
  .btn-next{
    background:var(--amber);
    color:#20180a;
    flex:1;
  }
  .btn-next:disabled{
    opacity:.4;
    cursor:not-allowed;
  }
  .part-summary{
    font-size:12px;
    color:var(--sub);
    margin-bottom:14px;
    border-left:2px solid var(--amber);
    padding-left:10px;
  }
  .section-note{
    display:inline-block;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--amber);
    background:var(--amber-dim);
    padding:3px 8px;
    border-radius:4px;
    margin-bottom:10px;
  }
  .summary-list{
    font-size:13px;
    line-height:1.7;
    max-height:340px;
    overflow-y:auto;
  }
  .summary-list .row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid var(--panel-line);
    padding:6px 0;
  }
  .summary-list .k{color:var(--sub);}
  .summary-list .v{text-align:right;font-weight:500;}
  .finish-icon{
    text-align:center;
    font-size:40px;
    margin-bottom:6px;
  }
  .addr-box{
    background:var(--bg);
    border:1px solid var(--panel-line);
    border-radius:8px;
    padding:14px;
    margin-bottom:16px;
  }
  .addr-label{
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--sub);
    margin-bottom:6px;
  }
  .addr{
    font-size:14px;
    word-break:break-all;
    line-height:1.5;
  }
  .addr-copy{
    width:100%;
    margin-top:12px;
    padding:11px;
    font-size:14px;
  }
  .yn-btn.primary{
    background:var(--amber);
    color:#20180a;
    border-color:var(--amber);
  }
  .opt-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:16px;
  }
  .opt-list .yn-btn{
    display:block;
    text-align:left;
    padding:16px 16px;
  }
  .opt-title{
    display:block;
    font-size:18px;
    font-weight:800;
    letter-spacing:.03em;
  }
  .opt-sub{
    display:block;
    font-size:12px;
    font-weight:400;
    color:var(--sub);
    margin-top:3px;
    line-height:1.35;
  }
  .yn-btn.primary .opt-sub{ color:#5c4715; font-size:12.5px; }
  .yn-btn.opt-off{ opacity:.45; }
  .hidden{display:none !important;}
</style>
</head>
<body>

<div class="card">
  <div class="head">
    <div class="tag">MagTec Alaska</div>
    <h1>Service Order Worksheet</h1>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="step-count" id="stepCount"></div>

  <div class="body" id="body">
    <div class="q-label">This page needs a real browser</div>
    <div class="q-help">You are seeing this because the file is open in a preview window that cannot run the form. Open it in Safari or Chrome instead.</div>
  </div>

  <div class="foot">
    <button class="nav btn-back" id="backBtn">Back</button>
    <button class="nav btn-next" id="nextBtn">Next</button>
  </div>
</div>

// ---- Offline PDF filler: appends an incremental update to the blank worksheet ----

function b64ToBytes(b64){
  var bin = atob(b64);
  var out = new Uint8Array(bin.length);
  for(var n = 0; n < bin.length; n++) out[n] = bin.charCodeAt(n);
  return out;
}

function pdfStr(s){
  return '(' + String(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)') + ')';
}

function latin(s){
  // PDF text is written as Latin-1; swap anything outside it for a close ASCII match
  return String(s)
    .replace(/[\u2018\u2019\u201B]/g, "'")
    .replace(/[\u201C\u201D]/g, '"')
    .replace(/[\u2013\u2014\u2212]/g, '-')
    .replace(/\u2026/g, '...')
    .replace(/\u00A0/g, ' ')
    .replace(/[^\x00-\xFF]/g, '?');
}

function textWidth(s, size){
  var W = PDFMETA.widths, t = 0;
  for(var n = 0; n < s.length; n++){
    var c = s.charCodeAt(n);
    t += (c < 256 && W[c]) ? W[c] : 500;
  }
  return t * size / 1000;
}

function wrapText(s, size, maxw){
  var out = [], paras = String(s).split('\n');
  for(var p = 0; p < paras.length; p++){
    var words = paras[p].split(' '), line = '';
    for(var w = 0; w < words.length; w++){
      var trial = line ? line + ' ' + words[w] : words[w];
      if(textWidth(trial, size) <= maxw || !line){ line = trial; }
      else { out.push(line); line = words[w]; }
    }
    out.push(line);
  }
  return out;
}

function appearanceStream(value, rect, da, multiline){
  var w = rect[2] - rect[0], h = rect[3] - rect[1];
  var mt = /\/Helv\s+([\d.]+)\s+Tf/.exec(da);
  var size = (mt && parseFloat(mt[1]) > 0) ? parseFloat(mt[1]) : 7;
  var daFixed = da.replace(/\/Helv\s+[\d.]+\s+Tf/, '/Helv ' + size + ' Tf');
  var pad = 2, content;

  if(value === ''){
    content = '/Tx BMC EMC';
  } else if(multiline){
    var lines = wrapText(value, size, w - 2*pad);
    var lead = size * 1.16, y = h - pad - size, body = '';
    for(var n = 0; n < lines.length && y >= -size; n++){
      body += 'BT ' + daFixed + ' ' + pad + ' ' + round4(y) + ' Td ' + pdfStr(lines[n]) + ' Tj ET\n';
      y -= lead;
    }
    content = '/Tx BMC q BT ET\n' + body + 'Q EMC';
  } else {
    var y1 = round4((h - size)/2 + size*0.22);
    content = '/Tx BMC q BT ' + daFixed + ' ' + pad + ' ' + y1 + ' Td ' + pdfStr(value) + ' Tj ET Q EMC';
  }

  return '<</Type/XObject/Subtype/Form/FormType 1/BBox[0 0 ' + round4(w) + ' ' + round4(h) + ']'
       + '/Resources<</Font<</Helv ' + PDFMETA.consts.HELV + ' 0 R>>/ProcSet[/PDF/Text]>>'
       + '/Length ' + content.length + '>>stream\n' + content + '\nendstream';
}

function round4(v){
  var r = Math.round(v * 10000) / 10000;
  return String(r);
}

// Builds the filled PDF. values: {fieldName: string}. checks: {fieldName: bool}
function buildFilledPdf(values, checks){
  var C = PDFMETA.consts, F = PDFMETA.fields;
  var objs = {}, next = C.SIZE;

  Object.keys(values).forEach(function(name){
    var meta = F[name];
    if(!meta || meta.ft !== 'tx') return;
    var val = latin(values[name] == null ? '' : values[name]);

    var apNum = next++;
    objs[apNum] = appearanceStream(val, meta.rect, meta.da, meta.ml);
    var apRef = '/AP<</N ' + apNum + ' 0 R>>';

    if(meta.p === meta.w){
      objs[meta.p] = meta.ptpl + '/V' + pdfStr(val) + apRef + '>>';
    } else {
      objs[meta.p] = meta.ptpl + '/V' + pdfStr(val) + '>>';
      objs[meta.w] = meta.wtpl + apRef + '>>';
    }
  });

  Object.keys(checks).forEach(function(name){
    var meta = F[name];
    if(!meta || meta.ft !== 'btn') return;
    var state = checks[name] ? '/Yes' : '/Off';
    objs[meta.w] = meta.wtpl + '/V' + state + '/AS' + state + '>>';
  });

  objs[C.ACRO] = C.ACRO_TPL + '/NeedAppearances true>>';

  // ---- assemble ----
  var base = b64ToBytes(BLANK_PDF_B64);
  var chunks = [base];
  var pos = base.length;
  var offsets = {};

  var nums = Object.keys(objs).map(Number).sort(function(a,b){ return a-b; });
  nums.forEach(function(num){
    offsets[num] = pos;
    var body = num + ' 0 obj\n' + objs[num] + '\nendobj\n';
    var bytes = strToBytes(body);
    chunks.push(bytes);
    pos += bytes.length;
  });

  var xrefNum = next++;
  offsets[xrefNum] = pos;
  var newSize = next;

  var all = Object.keys(offsets).map(Number).sort(function(a,b){ return a-b; });
  var index = [], data = [];
  var i = 0;
  while(i < all.length){
    var j = i;
    while(j + 1 < all.length && all[j+1] === all[j] + 1) j++;
    index.push(all[i], j - i + 1);
    for(var k = i; k <= j; k++){
      var off = offsets[all[k]];
      data.push(1, (off >>> 24) & 255, (off >>> 16) & 255, (off >>> 8) & 255, off & 255, 0, 0);
    }
    i = j + 1;
  }

  var xd = '<</Type/XRef/Size ' + newSize + '/Index[' + index.join(' ') + ']/W[1 4 2]'
         + '/Root ' + C.ROOT + ' 0 R/Prev ' + C.PREV
         + (C.ID ? '/ID' + C.ID : '')
         + '/Length ' + data.length + '>>';

  chunks.push(strToBytes(xrefNum + ' 0 obj\n' + xd + 'stream\n'));
  chunks.push(new Uint8Array(data));
  chunks.push(strToBytes('\nendstream\nendobj\nstartxref\n' + offsets[xrefNum] + '\n%%EOF\n'));

  var total = 0;
  chunks.forEach(function(c){ total += c.length; });
  var out = new Uint8Array(total), at = 0;
  chunks.forEach(function(c){ out.set(c, at); at += c.length; });
  return out;
}

function strToBytes(s){
  var out = new Uint8Array(s.length);
  for(var n = 0; n < s.length; n++) out[n] = s.charCodeAt(n) & 255;
  return out;
}

</script>

<script>
(function(){
"use strict";

var answers = {};
var parts = [];
var pdfBytes = null;
var pdfFileName = 'service_order.pdf';
var emailBody = '';
var emailSubject = '';

// Flat, linear question list. Parts questions get spliced in dynamically.
var BASE = [
  {k:'techName',        label:'Technician name',              t:'text'},
  {k:'division',        label:'Division',                     t:'text'},
  {k:'project',         label:'Project',                      t:'text'},
  {k:'date',            label:'Date',                         t:'date', today:true},
  {k:'assetNo',         label:'Asset number',                 t:'text'},
  {k:'hours',           label:'Hours',                        t:'number'},
  {k:'mileage',         label:'Mileage',                      t:'number'},
  {k:'serviceOrderNo',  label:'Service order (SE) number',    t:'text'},
  {k:'nextServiceDue',  label:'Next service due',             t:'text', help:'Leave blank if there is no next service scheduled.'},
  {k:'seNeeded',        label:'SE needed?',                   t:'yn'},
  {k:'seCompleted',     label:'SE completed?',                t:'yn'},
  {k:'complaint',       label:'Description of complaint',     t:'textarea'},
  {k:'correction',      label:'Correction description',       t:'textarea'},
  {k:'__parts',         label:'Parts',                        t:'parts'},
  {k:'laborTime',       label:'Labor time', help:'Total time spent on the repair', t:'text'},
  {k:'inspectionReport',label:'Did you fill out an inspection report?', t:'yn'},
  {k:'__photos',        label:'Take photos of the repair', help:'Attach them to the email before you send it, if possible.', t:'ack'},
  {k:'__summary',       label:'Review',                       t:'summary'}
];

// Parts sub-flow state
var PART_ORDER = ['desc','partNo','qty','addMore'];
var partStage = 'desc';
var draft = {};

var i = 0;

var bodyEl      = document.getElementById('body');
var nextBtn     = document.getElementById('nextBtn');
var backBtn     = document.getElementById('backBtn');
var progressEl  = document.getElementById('progressFill');
var countEl     = document.getElementById('stepCount');

function today(){
  var d = new Date();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var day = String(d.getDate()).padStart(2,'0');
  return d.getFullYear()+'-'+m+'-'+day;
}

function esc(v){
  return String(v==null?'':v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function chrome(){
  var total = BASE.length + parts.length;
  var pct = Math.min(100, Math.round((i/total)*100));
  progressEl.style.width = pct + '%';
  countEl.textContent = 'Step ' + (i+1) + ' of ' + total;
  backBtn.style.visibility = (i === 0 && partStage === 'desc' && parts.length === 0) ? 'hidden' : 'visible';
}

function render(){
  var step = BASE[i];
  chrome();
  nextBtn.textContent = 'Next';
  nextBtn.classList.remove('hidden');
  backBtn.classList.remove('hidden');

  var html = '';

  if(step.t === 'text' || step.t === 'number' || step.t === 'date'){
    var val = answers[step.k];
    if(val == null && step.today) val = today();
    html = '<div class="q-label">'+esc(step.label)+'</div>'
         + (step.help ? '<div class="q-help">'+esc(step.help)+'</div>' : '')
         + '<input type="'+step.t+'" id="input" value="'+esc(val)+'">';
  }

  else if(step.t === 'textarea'){
    html = '<div class="q-label">'+esc(step.label)+'</div>'
         + '<textarea id="input">'+esc(answers[step.k])+'</textarea>';
  }

  else if(step.t === 'yn'){
    var cur = answers[step.k];
    html = '<div class="q-label">'+esc(step.label)+'</div>'
         + (step.help ? '<div class="q-help">'+esc(step.help)+'</div>' : '')
         + '<div class="yn-row">'
         + '<button type="button" class="yn-btn'+(cur==='YES'?' selected-yes':'')+'" data-action="answer" data-val="YES">Yes</button>'
         + '<button type="button" class="yn-btn'+(cur==='NO'?' selected-no':'')+'" data-action="answer" data-val="NO">No</button>'
         + '</div>';
  }

  else if(step.t === 'ack'){
    html = '<div class="q-label">'+esc(step.label)+'</div>'
         + '<div class="q-help">'+esc(step.help)+'</div>';
    nextBtn.textContent = 'Got it';
  }

  else if(step.t === 'parts'){
    html = partsHtml();
  }

  else if(step.t === 'summary'){
    html = summaryHtml();
    nextBtn.textContent = 'Finish and open email';
  }

  bodyEl.innerHTML = html;

  var inp = document.getElementById('input') || document.getElementById('partInput');
  if(inp){
    try { inp.focus(); } catch(e){}
  }
}

function partsHtml(){
  var labels = {
    desc:   'Part description',
    partNo: 'Part number',
    qty:    'Quantity'
  };
  var n = parts.length + 1;
  var head = parts.length
    ? '<div class="part-summary">'+parts.length+' part'+(parts.length>1?'s':'')+' added so far</div>'
    : '';

  if(partStage === 'addMore'){
    return head
      + '<div class="q-label">Add another part?</div>'
      + '<div class="yn-row">'
      + '<button type="button" class="yn-btn" data-action="addmore" data-val="YES">Yes</button>'
      + '<button type="button" class="yn-btn" data-action="addmore" data-val="NO">No</button>'
      + '</div>';
  }

  var type = partStage === 'qty' ? 'number' : 'text';
  return head
    + '<div class="q-label">Part '+n+' &mdash; '+esc(labels[partStage])+'</div>'
    + '<input type="'+type+'" id="partInput" value="'+esc(draft[partStage])+'">';
}

function summaryHtml(){
  var rows = [
    ['Technician',        answers.techName],
    ['Division',          answers.division],
    ['Project',           answers.project],
    ['Date',              answers.date],
    ['Asset No',          answers.assetNo],
    ['Hours',             answers.hours],
    ['Mileage',           answers.mileage],
    ['Service Order (SE) #', answers.serviceOrderNo],
    ['Next Service Due',  answers.nextServiceDue],
    ['SE Needed',         answers.seNeeded],
    ['SE Completed',      answers.seCompleted],
    ['Complaint',         answers.complaint],
    ['Correction',        answers.correction],
    ['Parts Added',       parts.length],
    ['Labor Time',        answers.laborTime],
    ['Inspection Report', answers.inspectionReport]
  ];
  var h = '<div class="section-note">Ready to send</div>'
        + '<div class="q-help">Check this over, then finish to open your email app with everything filled in.</div>'
        + '<div class="summary-list">';
  for(var r=0; r<rows.length; r++){
    var v = rows[r][1];
    h += '<div class="row"><div class="k">'+esc(rows[r][0])+'</div>'
       + '<div class="v">'+((v===undefined||v===''||v===null)?'&mdash;':esc(v))+'</div></div>';
  }
  return h + '</div>';
}

function saveInput(){
  var step = BASE[i];
  var el = document.getElementById('input');
  if(el) answers[step.k] = el.value;
  else if(step.today && answers[step.k] == null) answers[step.k] = today();
}

function forward(){
  var step = BASE[i];

  if(step.t === 'parts'){
    if(partStage === 'addMore') return; // buttons drive this one
    var el = document.getElementById('partInput');
    if(el) draft[partStage] = el.value;
    advancePart();
    return;
  }

  if(step.t === 'summary'){ finish(); return; }

  if(step.t === 'yn'){
    if(answers[step.k]) { i++; render(); }
    return;
  }

  saveInput();
  i++;
  render();
}

function advancePart(){
  var pos = PART_ORDER.indexOf(partStage);
  var next = PART_ORDER[pos+1];
  if(next === 'addMore'){
    parts.push({
      desc: draft.desc || '',
      partNo: draft.partNo || '',
      qty: draft.qty || ''
    });
    draft = {};
  }
  partStage = next;
  render();
}

function back(){
  var step = BASE[i];

  if(step.t === 'parts'){
    var pos = PART_ORDER.indexOf(partStage);
    if(pos > 0){
      if(partStage === 'addMore' && parts.length){
        draft = parts.pop();
      }
      partStage = PART_ORDER[pos-1];
      render();
      return;
    }
    if(parts.length){
      draft = parts.pop();
      partStage = 'qty';
      render();
      return;
    }
  }

  if(i > 0){
    if(BASE[i].t === 'text' || BASE[i].t === 'number' || BASE[i].t === 'date' || BASE[i].t === 'textarea'){
      saveInput();
    }
    i--;
    if(BASE[i].t === 'parts'){
      partStage = parts.length ? 'addMore' : 'desc';
    }
    render();
  }
}

// Single delegated listener. Survives every re-render.
document.addEventListener('click', function(ev){
  var btn = ev.target.closest ? ev.target.closest('button') : null;
  if(!btn) return;
  var action = btn.getAttribute('data-action');

  try {
    if(btn.id === 'nextBtn'){ forward(); return; }
    if(btn.id === 'backBtn'){ back(); return; }

    if(action === 'copyaddr'){ doCopyAddresses(btn); return; }
    if(action === 'eml'){      doEml();      return; }
    if(action === 'share'){    doShare();    return; }
    if(action === 'savepdf'){  doSavePdf();  return; }
    if(action === 'mailto'){   doMailto();   return; }

    if(action === 'answer'){
      answers[BASE[i].k] = btn.getAttribute('data-val');
      i++;
      render();
      return;
    }

    if(action === 'partanswer'){
      draft[partStage] = btn.getAttribute('data-val');
      advancePart();
      return;
    }

    if(action === 'addmore'){
      if(btn.getAttribute('data-val') === 'YES'){
        draft = {};
        partStage = 'desc';
        render();
      } else {
        i++;
        render();
      }
      return;
    }
  } catch(err){
    showError(err);
  }
});

document.addEventListener('keydown', function(ev){
  if(ev.key !== 'Enter') return;
  var t = ev.target;
  if(t && (t.id === 'input' || t.id === 'partInput') && t.tagName !== 'TEXTAREA'){
    ev.preventDefault();
    try { forward(); } catch(err){ showError(err); }
  }
});

window.addEventListener('error', function(e){
  var b = document.getElementById('body');
  if(b) b.innerHTML = '<div class="q-label">Something broke on startup</div>'
      + '<div class="q-help">' + String(e.message) + '</div>';
});

window.onerror = function(msg, src, line){
  showError(msg + ' (line ' + line + ')');
};

function showError(e){
  bodyEl.innerHTML = '<div class="q-label">Something broke</div>'
    + '<div class="q-help">' + esc(e && e.message ? e.message : e) + '</div>';
}

function finish(){
  var partsText = parts.length
    ? parts.map(function(p, n){
        return '  Part ' + (n+1) + ': ' + (p.desc||'-')
             + ' | Part# ' + (p.partNo||'-')
             + ' | Qty: ' + (p.qty||'-');
      }).join('\n')
    : '  None entered';

  emailBody = [
    'SEND THIS TO:',
    'Nsrentals@magtecalaska.com',
    'nsshop@magtecalaska.com',
    '',
    '================================',
    '',
    'MAGTEC SERVICE ORDER WORKSHEET',
    '',
    'Technician Name: ' + (answers.techName||''),
    'Division: ' + (answers.division||''),
    'Project: ' + (answers.project||''),
    'Date: ' + (answers.date||''),
    'Asset No: ' + (answers.assetNo||''),
    'Hours: ' + (answers.hours||''),
    'Mileage: ' + (answers.mileage||''),
    'Service Order (SE) #: ' + (answers.serviceOrderNo||''),
    'Next Service Due: ' + (answers.nextServiceDue||''),
    'SE Needed: ' + (answers.seNeeded||''),
    'SE Completed: ' + (answers.seCompleted||''),
    '',
    'Description of Complaint:',
    (answers.complaint||''),
    '',
    'Correction Description:',
    (answers.correction||''),
    '',
    'Parts:',
    partsText,
    '',
    'Labor Time: ' + (answers.laborTime||''),
    '',
    'Notes:',
    '  Inspection report filled out: ' + (answers.inspectionReport||'NOT ANSWERED'),
    '',
    '--',
    'Filled worksheet PDF is attached. Photos of the repair should be attached before sending.'
  ].join('\n');

  emailSubject = 'SE ' + (answers.serviceOrderNo||'') + ' - Asset ' + (answers.assetNo||'');
  // Phone mail apps use the attachment filename as the subject, so it matches exactly
  pdfFileName = emailSubject.replace(/[\\/:*?"<>|]/g,'-') + '.pdf';

  nextBtn.classList.add('hidden');
  backBtn.classList.add('hidden');
  bodyEl.innerHTML = '<div class="q-label">Building the PDF...</div>'
                   + '<div class="q-help">One moment.</div>';

  buildPdf().then(function(bytes){
    pdfBytes = bytes;
    showSendScreen(true);
  }).catch(function(err){
    pdfBytes = null;
    showSendScreen(false, err && err.message ? err.message : String(err));
  });
}

function buildPdf(){
  return new Promise(function(resolve, reject){
    try {
      var vals = {
        technician_name:          answers.techName,
        division:                 answers.division,
        project:                  answers.project,
        date:                     answers.date,
        asset_no:                 answers.assetNo,
        hours:                    answers.hours,
        mileage:                  answers.mileage,
        service_order_number:     answers.serviceOrderNo,
        next_service_due:         answers.nextServiceDue,
        description_of_complaint: answers.complaint,
        correction_description:   answers.correction,
        labor_time:               answers.laborTime
      };

      // The worksheet has six parts rows
      var rows = Math.min(parts.length, 6);
      for(var r = 0; r < rows; r++){
        vals['parts_description_' + (r+1)] = parts[r].desc;
        vals['part_number_' + (r+1)]       = parts[r].partNo;
        vals['qty_' + (r+1)]               = parts[r].qty;
      }

      var notes = ['Inspection report filled out: ' + (answers.inspectionReport || 'NOT ANSWERED')];
      if(parts.length > 6){
        notes.push('Additional parts: ' + parts.slice(6).map(function(p){
          return (p.desc||'-') + ' / ' + (p.partNo||'-') + ' / qty ' + (p.qty||'-');
        }).join('; '));
      }
      vals.notes_1 = notes[0] || '';
      vals.notes_2 = notes[1] || '';
      vals.notes_3 = notes[2] || '';

      // Every checkbox off, then tick only what was answered
      var checks = {};
      Object.keys(PDFMETA.fields).forEach(function(k){
        if(PDFMETA.fields[k].ft === 'btn') checks[k] = false;
      });
      checks.se_needed_yes    = answers.seNeeded    === 'YES';
      checks.se_needed_no     = answers.seNeeded    === 'NO';
      checks.se_completed_yes = answers.seCompleted === 'YES';
      checks.se_completed_no  = answers.seCompleted === 'NO';

      resolve(buildFilledPdf(vals, checks));
    } catch(err){
      reject(err);
    }
  });
}

function isDesktop(){
  var ua = navigator.userAgent || '';
  var touchMac = (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPad posing as Mac
  if(/Android|iPhone|iPad|iPod|Mobile|Silk|Kindle/i.test(ua) || touchMac) return false;
  return /Windows|Macintosh|Linux|CrOS/i.test(ua);
}

function showSendScreen(ok, errMsg){
  var canShareFiles = false;
  try {
    canShareFiles = !!(navigator.canShare && pdfBytes && navigator.canShare({
      files: [new File([new Blob([pdfBytes])], pdfFileName, {type:'application/pdf'})]
    }));
  } catch(e){ canShareFiles = false; }

  var h = '';

  if(!ok){
    h += '<div class="section-note" style="background:rgba(229,83,61,.18);color:#e5533d;">PDF not built</div>'
       + '<div class="q-help">' + esc(errMsg || 'Unknown problem') + ' You can still send the details as plain text.</div>'
       + '<div class="opt-list">'
       + '<button type="button" class="yn-btn primary" data-action="mailto">Open a plain text email</button>'
       + '</div>';
    bodyEl.innerHTML = h;
    return;
  }

  h += '<div class="section-note">Worksheet filled in</div>'
     + '<div class="q-help" style="margin-bottom:16px;">Pick how you are sending it. The addresses are written at the top of the email either way.</div>'
     + '<div class="opt-list">'

     + '<button type="button" class="yn-btn primary" data-action="eml">'
     +   '<span class="opt-title">COMPUTER</span>'
     +   '<span class="opt-sub">Opens the email ready to go. Addresses, subject and PDF all done for you.</span>'
     + '</button>'

     + '<button type="button" class="yn-btn primary" data-action="share">'
     +   '<span class="opt-title">PHONE</span>'
     +   '<span class="opt-sub">' + (canShareFiles
          ? 'Opens your mail app with the PDF attached. Copy the addresses off the top of the email.'
          : 'Not available on this device. Use Save as PDF instead.') + '</span>'
     + '</button>'

     + '<button type="button" class="yn-btn primary" data-action="savepdf">'
     +   '<span class="opt-title">SAVE AS PDF</span>'
     +   '<span class="opt-sub">Saves the worksheet to this device so you can attach it yourself.</span>'
     + '</button>'

     + '</div>'

     + '<div class="q-help" style="margin-bottom:0;">Attach your repair photos before you send.</div>';

  bodyEl.innerHTML = h;
}

function pdfBlob(){
  return new Blob([pdfBytes], {type:'application/pdf'});
}

function bytesToBase64(bytes){
  var out = '', chunk = 0x8000;
  for(var n = 0; n < bytes.length; n += chunk){
    out += String.fromCharCode.apply(null, bytes.subarray(n, n + chunk));
  }
  return btoa(out);
}

// Wraps base64 at 76 characters, as MIME requires
function wrap76(b64){
  var out = [];
  for(var n = 0; n < b64.length; n += 76) out.push(b64.substr(n, 76));
  return out.join('\r\n');
}

function buildEml(){
  var boundary = '----magtec' + Date.now().toString(36);
  var to = 'Nsrentals@magtecalaska.com, nsshop@magtecalaska.com';
  var body = emailBody.replace(/\n/g, '\r\n');

  return [
    'X-Unsent: 1',
    'To: ' + to,
    'Subject: ' + emailSubject,
    'MIME-Version: 1.0',
    'Content-Type: multipart/mixed; boundary="' + boundary + '"',
    '',
    '--' + boundary,
    'Content-Type: text/plain; charset="utf-8"',
    'Content-Transfer-Encoding: 8bit',
    '',
    body,
    '',
    '--' + boundary,
    'Content-Type: application/pdf; name="' + pdfFileName + '"',
    'Content-Transfer-Encoding: base64',
    'Content-Disposition: attachment; filename="' + pdfFileName + '"',
    '',
    wrap76(bytesToBase64(pdfBytes)),
    '',
    '--' + boundary + '--',
    ''
  ].join('\r\n');
}

function doEml(){
  var blob = new Blob([buildEml()], {type:'message/rfc822'});
  downloadBlob(blob, emailSubject.replace(/[\\/:*?"<>|]/g,'-') + '.eml');
}

function downloadBlob(blob, name){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 8000);
}

function doShare(){
  var file = new File([pdfBlob()], pdfFileName, {type:'application/pdf'});
  // Phone mail apps take the first line of the shared text as the subject,
  // so the subject has to lead. The addresses follow right underneath it.
  navigator.share({
    title: emailSubject,
    text: emailSubject + '\n\n' + emailBody,
    files: [file]
  }).catch(function(){});
}

function doSavePdf(){
  downloadBlob(pdfBlob(), pdfFileName);
}

function doCopyAddresses(btn){
  var addrs = 'Nsrentals@magtecalaska.com, nsshop@magtecalaska.com';
  var done = function(){
    btn.textContent = 'Copied';
    setTimeout(function(){ btn.textContent = 'Copy both addresses'; }, 2500);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(addrs).then(done).catch(function(){ legacyCopy(addrs, done); });
  } else {
    legacyCopy(addrs, done);
  }
}

function legacyCopy(txt, done){
  var ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch(e){}
  document.body.removeChild(ta);
}

function doMailto(){
  var to = 'Nsrentals@magtecalaska.com,nsshop@magtecalaska.com';
  window.location.href = 'mailto:' + to
    + '?subject=' + encodeURIComponent(emailSubject)
    + '&body=' + encodeURIComponent(emailBody);
}

render();

})();
</script>
