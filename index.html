<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14181c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Service Order">
<title>MagTec Service Order</title>
<style>
  :root {
    --bg:#14181c;
    --panel:#1c2127;
    --panel-line:#2b323b;
    --text:#eef1f4;
    --sub:#8d98a3;
    --amber:#f5a623;
    --amber-dim:#3a2f14;
    --danger:#e5533d;
    --ok:#3ba776;
  }
  * { box-sizing:border-box; }
  html, body { min-height:100%; }
  body {
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:20px;
  }
  .card {
    width:100%;
    max-width:520px;
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:10px;
    overflow:hidden;
  }
  .head { padding:18px 22px 14px; border-bottom:1px solid var(--panel-line); }
  .head .tag {
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--amber);
    font-weight:700;
  }
  .head h1 { margin:4px 0 0; font-size:19px; font-weight:600; }
  .progress-track { height:4px; background:var(--panel-line); width:100%; }
  .progress-fill { height:100%; background:var(--amber); width:0; transition:width .25s ease; }
  .step-count { padding:10px 22px 0; font-size:12px; color:var(--sub); }
  .body {
    padding:22px;
    min-height:220px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .q-label { font-size:16px; font-weight:600; margin-bottom:4px; line-height:1.35; }
  .q-help { font-size:13px; color:var(--sub); margin-bottom:16px; line-height:1.4; }
  input, textarea {
    width:100%;
    background:var(--bg);
    border:1px solid var(--panel-line);
    color:var(--text);
    font-size:16px;
    padding:13px 14px;
    border-radius:7px;
    font-family:inherit;
    outline:none;
  }
  input:focus, textarea:focus { border-color:var(--amber); }
  textarea { min-height:100px; resize:vertical; }
  .yn-row { display:flex; gap:12px; }
  .yn-btn {
    flex:1;
    padding:15px;
    border-radius:7px;
    border:1px solid var(--panel-line);
    background:var(--bg);
    color:var(--text);
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .yn-btn.selected-yes { border-color:var(--ok); color:var(--ok); }
  .yn-btn.selected-no { border-color:var(--danger); color:var(--danger); }
  .yn-btn.primary { background:var(--amber); color:#20180a; border-color:var(--amber); }
  .foot { display:flex; gap:10px; padding:16px 22px 22px; border-top:1px solid var(--panel-line); }
  button.nav {
    border-radius:7px;
    padding:14px 18px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-back { background:transparent; color:var(--sub); border:1px solid var(--panel-line); }
  .btn-next { background:var(--amber); color:#20180a; border:0; flex:1; }
  .part-summary { font-size:12px; color:var(--sub); margin-bottom:14px; border-left:2px solid var(--amber); padding-left:10px; }
  .section-note {
    display:inline-block;
    align-self:flex-start;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--amber);
    background:var(--amber-dim);
    padding:3px 8px;
    border-radius:4px;
    margin-bottom:10px;
  }
  .summary-list { font-size:13px; line-height:1.7; max-height:340px; overflow-y:auto; }
  .summary-list .row { display:flex; justify-content:space-between; gap:10px; border-bottom:1px solid var(--panel-line); padding:6px 0; }
  .summary-list .k { color:var(--sub); }
  .summary-list .v { text-align:right; font-weight:500; }
  .opt-list { display:flex; flex-direction:column; gap:10px; }
  .opt-list .yn-btn { width:100%; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="tag">MagTec Alaska</div>
    <h1>Service Order Worksheet</h1>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="step-count" id="stepCount"></div>
  <div class="body" id="body"></div>
  <div class="foot" id="foot">
    <button type="button" class="nav btn-back" id="backBtn">Back</button>
    <button type="button" class="nav btn-next" id="nextBtn">Next</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var RECIPIENTS = 'Nsrentals@magtecalaska.com,nsshop@magtecalaska.com';
  var answers = {};
  var parts = [];
  var draft = {};
  var partStage = 'desc';
  var index = 0;
  var emailSubject = '';
  var emailBody = '';

  var steps = [
    {k:'techName', label:'Technician name', t:'text'},
    {k:'division', label:'Division', t:'text'},
    {k:'project', label:'Project', t:'text'},
    {k:'date', label:'Date', t:'date', today:true},
    {k:'assetNo', label:'Asset number', t:'text'},
    {k:'hours', label:'Hours', t:'text'},
    {k:'hoursNextServiceDue', label:'Hours next service due', t:'text'},
    {k:'mileage', label:'Mileage', t:'text'},
    {k:'serviceOrderNo', label:'Service order (SE) number', t:'text'},
    {k:'nextServiceDue', label:'Next service due', t:'text', help:'Leave blank if there is no next service scheduled.'},
    {k:'seNeeded', label:'SE needed?', t:'yn'},
    {k:'seCompleted', label:'SE completed?', t:'yn'},
    {k:'complaint', label:'Description of complaint', t:'textarea'},
    {k:'correction', label:'Correction description', t:'textarea'},
    {k:'__parts', label:'Parts', t:'parts'},
    {k:'laborTime', label:'Labor time', help:'Total time spent on the repair', t:'text'},
    {k:'inspectionReport', label:'Did you fill out an inspection report?', t:'yn'},
    {k:'__photos', label:'Take photos of the repair', help:'Attach them to the email before sending, if needed.', t:'ack'},
    {k:'__summary', label:'Review', t:'summary'}
  ];

  var bodyEl = document.getElementById('body');
  var footEl = document.getElementById('foot');
  var nextBtn = document.getElementById('nextBtn');
  var backBtn = document.getElementById('backBtn');
  var progressEl = document.getElementById('progressFill');
  var countEl = document.getElementById('stepCount');

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function updateChrome() {
    progressEl.style.width = Math.round((index / steps.length) * 100) + '%';
    countEl.textContent = 'Step ' + (index + 1) + ' of ' + steps.length;
    backBtn.style.visibility = index === 0 ? 'hidden' : 'visible';
  }

  function render() {
    var step = steps[index];
    footEl.classList.remove('hidden');
    nextBtn.textContent = 'Next';
    updateChrome();

    if (step.t === 'text' || step.t === 'date') {
      var value = answers[step.k];
      if (value == null && step.today) value = today();
      bodyEl.innerHTML = '<div class="q-label">' + esc(step.label) + '</div>'
        + (step.help ? '<div class="q-help">' + esc(step.help) + '</div>' : '')
        + '<input type="' + step.t + '" id="input" value="' + esc(value) + '">';
    } else if (step.t === 'textarea') {
      bodyEl.innerHTML = '<div class="q-label">' + esc(step.label) + '</div>'
        + '<textarea id="input">' + esc(answers[step.k]) + '</textarea>';
    } else if (step.t === 'yn') {
      bodyEl.innerHTML = '<div class="q-label">' + esc(step.label) + '</div>'
        + '<div class="yn-row">'
        + '<button type="button" class="yn-btn" data-action="answer" data-value="YES">Yes</button>'
        + '<button type="button" class="yn-btn" data-action="answer" data-value="NO">No</button>'
        + '</div>';
    } else if (step.t === 'ack') {
      bodyEl.innerHTML = '<div class="q-label">' + esc(step.label) + '</div><div class="q-help">' + esc(step.help) + '</div>';
      nextBtn.textContent = 'Got it';
    } else if (step.t === 'parts') {
      renderParts();
    } else if (step.t === 'summary') {
      renderSummary();
      nextBtn.textContent = 'Continue';
    }

    var input = document.getElementById('input') || document.getElementById('partInput');
    if (input) input.focus();
  }

  function renderParts() {
    var summary = parts.length ? '<div class="part-summary">' + parts.length + ' part' + (parts.length === 1 ? '' : 's') + ' added</div>' : '';
    if (partStage === 'addMore') {
      bodyEl.innerHTML = summary + '<div class="q-label">Add another part?</div><div class="yn-row">'
        + '<button type="button" class="yn-btn" data-action="add-more" data-value="YES">Yes</button>'
        + '<button type="button" class="yn-btn" data-action="add-more" data-value="NO">No</button></div>';
      return;
    }
    var labels = {desc:'Part description', partNo:'Part number', qty:'Quantity'};
    var type = 'text';
    bodyEl.innerHTML = summary + '<div class="q-label">Part ' + (parts.length + 1) + ': ' + labels[partStage] + '</div>'
      + '<input type="' + type + '" id="partInput" value="' + esc(draft[partStage]) + '">';
  }

  function renderSummary() {
    var rows = [
      ['Technician', answers.techName], ['Division', answers.division], ['Project', answers.project],
      ['Date', answers.date], ['Asset No', answers.assetNo], ['Hours', answers.hours],
      ['Hours next service due', answers.hoursNextServiceDue],
      ['Mileage', answers.mileage], ['Service Order (SE) #', answers.serviceOrderNo],
      ['Next Service Due', answers.nextServiceDue], ['SE Needed', answers.seNeeded],
      ['SE Completed', answers.seCompleted], ['Complaint', answers.complaint],
      ['Correction', answers.correction], ['Parts Added', parts.length],
      ['Labor Time', answers.laborTime], ['Inspection Report', answers.inspectionReport]
    ];
    var html = '<div class="section-note">Ready to send</div><div class="q-help">Check the details, then continue.</div><div class="summary-list">';
    rows.forEach(function (row) {
      html += '<div class="row"><div class="k">' + esc(row[0]) + '</div><div class="v">' + (row[1] ? esc(row[1]) : '&mdash;') + '</div></div>';
    });
    bodyEl.innerHTML = html + '</div>';
  }

  function saveInput() {
    var input = document.getElementById('input');
    if (input) answers[steps[index].k] = input.value;
  }

  function next() {
    var step = steps[index];
    if (step.t === 'parts') {
      if (partStage === 'addMore') return;
      var partInput = document.getElementById('partInput');
      draft[partStage] = partInput ? partInput.value : '';
      if (partStage === 'desc') partStage = 'partNo';
      else if (partStage === 'partNo') partStage = 'qty';
      else {
        parts.push({desc:draft.desc || '', partNo:draft.partNo || '', qty:draft.qty || ''});
        draft = {};
        partStage = 'addMore';
      }
      render();
      return;
    }
    if (step.t === 'summary') {
      prepareEmail();
      showFinish();
      return;
    }
    if (step.t === 'yn') return;
    saveInput();
    index += 1;
    render();
  }

  function back() {
    if (index === 0) return;
    if (steps[index].t !== 'parts') saveInput();
    index -= 1;
    if (steps[index].t === 'parts') partStage = parts.length ? 'addMore' : 'desc';
    render();
  }

  function prepareEmail() {
    var partsText = parts.length ? parts.map(function (part, number) {
      return '  Part ' + (number + 1) + ': ' + (part.desc || '-') + ' | Part# ' + (part.partNo || '-') + ' | Qty: ' + (part.qty || '-');
    }).join('\n') : '  None entered';

    emailSubject = 'SE ' + (answers.serviceOrderNo || '') + ' - Asset ' + (answers.assetNo || '');
    emailBody = [
      'MAGTEC SERVICE ORDER WORKSHEET', '',
      'Technician Name: ' + (answers.techName || ''),
      'Division: ' + (answers.division || ''),
      'Project: ' + (answers.project || ''),
      'Date: ' + (answers.date || ''),
      'Asset No: ' + (answers.assetNo || ''),
      'Hours: ' + (answers.hours || ''),
      'Hours next service due: ' + (answers.hoursNextServiceDue || ''),
      'Mileage: ' + (answers.mileage || ''),
      'Service Order (SE) #: ' + (answers.serviceOrderNo || ''),
      'Next Service Due: ' + (answers.nextServiceDue || ''),
      'SE Needed: ' + (answers.seNeeded || ''),
      'SE Completed: ' + (answers.seCompleted || ''), '',
      'Description of Complaint:', answers.complaint || '', '',
      'Correction Description:', answers.correction || '', '',
      'Parts:', partsText, '',
      'Labor Time: ' + (answers.laborTime || ''), '',
      'Inspection report filled out: ' + (answers.inspectionReport || 'NOT ANSWERED')
    ].join('\n');
  }

  function showFinish() {
    progressEl.style.width = '100%';
    countEl.textContent = 'Complete';
    footEl.classList.add('hidden');
    bodyEl.innerHTML = '<div class="section-note">Ready</div>'
      + '<div class="q-label">Your email is ready</div>'
      + '<div class="q-help">Both email addresses, the subject, and all worksheet details will be filled in automatically.</div>'
      + '<div class="opt-list">'
      + '<button type="button" class="yn-btn primary" data-action="send-email">Send email</button>'
      + '<button type="button" class="yn-btn" data-action="start-over">Start over</button>'
      + '</div>';
  }

  function sendEmail() {
    window.location.href = 'mailto:' + RECIPIENTS
      + '?subject=' + encodeURIComponent(emailSubject)
      + '&body=' + encodeURIComponent(emailBody);
  }

  function startOver() {
    answers = {};
    parts = [];
    draft = {};
    partStage = 'desc';
    index = 0;
    emailSubject = '';
    emailBody = '';
    render();
  }

  document.addEventListener('click', function (event) {
    var button = event.target.closest('button');
    if (!button) return;
    var action = button.getAttribute('data-action');
    if (button.id === 'nextBtn') next();
    else if (button.id === 'backBtn') back();
    else if (action === 'answer') {
      answers[steps[index].k] = button.getAttribute('data-value');
      index += 1;
      render();
    } else if (action === 'add-more') {
      if (button.getAttribute('data-value') === 'YES') {
        draft = {};
        partStage = 'desc';
        render();
      } else {
        index += 1;
        render();
      }
    } else if (action === 'send-email') sendEmail();
    else if (action === 'start-over') startOver();
  });

  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter' || event.target.tagName === 'TEXTAREA') return;
    if (event.target.id === 'input' || event.target.id === 'partInput') {
      event.preventDefault();
      next();
    }
  });

  render();
}());
</script>
</body>
</html>
